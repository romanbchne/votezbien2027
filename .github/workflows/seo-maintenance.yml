name: SEO maintenance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Générer le sitemap depuis les pages publiques
        run: npm run seo:sitemap
      - name: Vérifier que le sitemap commité est à jour
        run: git diff --exit-code -- sitemap.xml
      - name: Vérifier les métadonnées, canonicals et liens internes
        run: npm run seo:check
